<div class="DBhomePage">
    <div class="header">
        <h2>DB home page</h2>
    </div>
    <div>
        <!-- put link to DBcalander -->
        <!-- list of years data stored in local db: make a horizontal tab with 
            all the years. -->
        <!-- 2024 to 28 -->
        <!-- create a button for each year. that button will open the DBcalander.html 
            file with the year as a parameter -->
        <button class="year-button" onclick="openDBcalander('2024')">2024</button>
        <button class="year-button" onclick="openDBcalander('2025')">2025</button>
        <button class="year-button" onclick="openDBcalander('2026')">2026</button>
        <button class="year-button" onclick="openDBcalander('2027')">2027</button>
        <button class="year-button" onclick="openDBcalander('2028')">2028</button>

    </div>
    
    <div class="db-info-section">
        <div class="db-info-header">
            <h3>Local Database Information</h3>
            <span class="db-path">/Users/amitraj/git_repo_project/niftyOptionChartMaking/NiftyOptionChartMaking/database/LocalDatabase.db</span>
        </div>
        
        <div class="db-stats-grid">
            <div class="db-stat-card">
                <span class="stat-label">Total Entries</span>
                <span id="totalEntries" class="stat-val">-</span>
            </div>
            <div class="db-stat-card">
                <span class="stat-label">Total Records</span>
                <span id="totalRecords" class="stat-val">-</span>
            </div>
            <div class="db-stat-card">
                <span class="stat-label">Total Options Data</span>
                <span id="totalOptionsData" class="stat-val">-</span>
            </div>
        </div>

        <div class="db-details-list">
            <div class="db-detail-item">
                <span class="detail-label">Indexes Available</span>
                <span id="dbIndexes" class="detail-value">-</span>
            </div>
            <div class="db-detail-item">
                <span class="detail-label">Expiry Dates</span>
                <span id="dbExpiries" class="detail-value">-</span>
            </div>
            <div class="db-detail-item">
                <span class="detail-label">Trading Days Covered</span>
                <span id="dbTradingDays" class="detail-value">-</span>
            </div>
            <div class="db-detail-item">
                <span class="detail-label">Strikes Covered</span>
                <span id="dbStrikes" class="detail-value">-</span>
            </div>
        </div>
    </div>
</div>
