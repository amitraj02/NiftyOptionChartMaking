<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Nifty Option Chart displays</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/basicStructure.css">
    <link rel="stylesheet" href="../css/index.css">

</head>

<body>
    <!-- HEADER SECTION -->
    <div id="header">
        <h2>Nifty Option Chart Display</h2>
        <div class="header-time">Time: <span id="headerTime">--:--:--</span></div>
    </div>
    <!-- END HEADER SECTION -->

    <!-- NAVIGATION SECTION -->
    <nav class="nav-container" id="main-nav">
        <ul class="nav-tabs">
            <li><a href="#home">Home</a></li>
            <li><a href="#codeHelp">Code Help</a></li>
            <li><a href="#basicStructure">basic Structure</a></li>
            <li><a href="#DBhomePage">DB Home Page</a></li>
        </ul>
    </nav>
    <!-- END NAVIGATION SECTION -->

    <!-- MAIN BODY   SECTION -->
    <div class="mainbody" id="mainbody">
    </div>
    <!-- END MAIN BODY   SECTION -->


    <!-- FOOTER SECTION -->
    <div id="footer">
        <h3>this is the footer</h3>
        <p>&copy; 2026 trading backtest Project. All rights reserved.</p>

    </div>
    <!-- END FOOTER SECTION -->

    <script src="../js/clientInfo.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { primaryColor: '#3b82f6', primaryTextColor: '#f1f5f9', lineColor: '#94a3b8', secondaryColor: '#1e293b', tertiaryColor: '#0f172a' } });</script>
    <script type="module" src="../js/router.js"></script>
    <script>
        function updateClock() {
            const timeSpan = document.getElementById('headerTime');
            if (timeSpan) {
                const now = new Date();
                const formatted = now.toLocaleString('en-IN', {
                    timeZone: 'Asia/Kolkata',
                    dateStyle: 'medium',
                    timeStyle: 'medium',
                    hour12: true
                });
                timeSpan.textContent = formatted.toUpperCase();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>

</html>
