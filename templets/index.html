<body>

    <script>
        function updateClock() {
            const timeSpan = document.getElementById('headerTime');
            if (timeSpan) {
                const now = new Date();
                timeSpan.textContent = now.toLocaleTimeString();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
